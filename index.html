<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NBA 30-Team Depth Chart Wallboard</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: none;
    text-size-adjust: none;
  }
  
  body {
    background: #070a12;
    color: #f1f5f9;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 4px 8px 6px;
    gap: 4px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 22px;
    padding: 0 2px;
    flex-shrink: 0;
    z-index: 20;
  }

  .title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  h1 {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: #f8fafc;
    white-space: nowrap;
  }

  .legend {
    font-size: 10px;
    color: #94a3b8;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .legend-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 0px 5px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 600;
    color: #f1f5f9;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .injury-summaries { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .injury-summary {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border: 1px solid;
    border-radius: 5px;
    font-size: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .injury-summary strong { font-size: 12px; font-variant-numeric: tabular-nums; }
  .injury-summary span { font-size: 9px; font-weight: 800; text-transform: uppercase; }
  .summary-out { background: rgba(239, 68, 68, 0.1); border-color: #7f3038; color: #fca5a5; }
  .summary-dtd { background: rgba(234, 179, 8, 0.08); border-color: #68551e; color: #fde047; }
  .injury-summary:hover:not(:disabled) { filter: brightness(1.3); }
  .injury-summary:disabled { opacity: 0.5; cursor: default; }
  .injury-summary:focus-visible, .injury-player-button:focus-visible, .injury-close:focus-visible {
    outline: 2px solid #f97316;
    outline-offset: 2px;
  }

  .injury-dialog {
    width: min(1760px, calc(100vw - 24px));
    max-width: calc(100vw - 24px);
    height: min(820px, calc(100vh - 24px));
    height: min(820px, calc(100dvh - 24px));
    max-height: calc(100vh - 24px);
    max-height: calc(100dvh - 24px);
    margin: auto;
    padding: 0;
    color: #f1f5f9;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 10px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
    overflow: hidden;
  }
  .injury-dialog[open] { display: flex; flex-direction: column; }
  .injury-dialog::backdrop { background: rgba(5, 8, 15, 0.78); backdrop-filter: blur(3px); }
  .injury-dialog-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  .injury-dialog-header h2 { font-size: 16px; line-height: 1.25; }
  .injury-dialog-header p { margin-top: 3px; color: #94a3b8; font-size: 10px; line-height: 1.4; }
  .injury-dialog-header .injury-swipe-hint { display: none; }
  .injury-close {
    margin-left: auto;
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border: 1px solid #334155;
    border-radius: 5px;
    background: #1e293b;
    color: #cbd5e1;
    font-size: 20px;
    cursor: pointer;
  }
  .injury-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    padding: 8px;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }
  .injury-column {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid #263247;
    border-radius: 6px;
  }
  .injury-column-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    background: #162033;
    border-bottom: 1px solid #263247;
    flex-shrink: 0;
  }
  .injury-column-header h3 { font-size: 12px; font-weight: 700; }
  .injury-column-detail { font-size: 9px; color: #94a3b8; }
  .injury-column-count { margin-left: auto; font-size: 11px; font-weight: 700; color: #94a3b8; }
  .injury-column-players {
    flex: 1;
    min-height: 0;
    padding: 5px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  .injury-column-players:focus-visible { outline: 1px solid #f97316; outline-offset: -1px; }
  .injury-player-button {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 52px 18px;
    align-items: center;
    gap: 5px;
    min-height: 34px;
    padding: 4px 6px;
    margin-bottom: 4px;
    border: 1px solid #263247;
    border-radius: 4px;
    background: #111c2f;
    color: #f1f5f9;
    text-align: left;
    cursor: pointer;
  }
  .injury-player-button:last-child { margin-bottom: 0; }
  .injury-player-button:hover { background: #19273e; border-color: #64748b; }
  .injury-player-info { min-width: 0; }
  .injury-player-name { display: block; font-size: 12px; line-height: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .injury-player-team { display: flex; align-items: center; gap: 4px; height: 16px; color: #94a3b8; font-size: 9px; line-height: 10px; white-space: nowrap; }
  .injury-team-logo { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; }
  .injury-player-team-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .injury-status { font-size: 8px; font-weight: 800; text-align: center; }
  .injury-status-out { color: #fca5a5; }
  .injury-status-dtd { color: #fde047; }
  .injury-player-stats { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; line-height: 10px; }
  .injury-stat { display: flex; align-items: baseline; justify-content: space-between; gap: 3px; }
  .injury-stat-label { font-size: 8px; color: #94a3b8; text-transform: lowercase; }
  .injury-stat-value { font-size: 9px; font-weight: 600; }
  .injury-empty { padding: 24px 8px; text-align: center; color: #94a3b8; font-size: 12px; }

  .p-name.player-jump-highlight { border-radius: 2px; animation: playerJumpHighlight 1.6s linear both; }
  @keyframes playerJumpHighlight {
    from { box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 1); background-color: rgba(251, 191, 36, 0.35); }
    to { box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0); background-color: rgba(251, 191, 36, 0); }
  }

  .stat-toggles { display: none; }

  .stat-period-control {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: #94a3b8;
    font-size: 9px;
    font-weight: 600;
    flex-shrink: 0;
  }

  #stats-period {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 4px;
    color: #f8fafc;
    font-size: 10px;
    padding: 1px 4px;
    cursor: pointer;
  }

  #stats-period:focus-visible {
    outline: 1px solid #f97316;
    outline-offset: 2px;
  }

  .stats-status {
    font-size: 9px;
    color: #94a3b8;
    white-space: nowrap;
  }

  .stat-toggles label {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    color: #94a3b8;
    font-size: 9px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .stat-toggles input {
    width: 11px;
    height: 11px;
    margin: 0;
    accent-color: #f97316;
    cursor: pointer;
  }

  .stat-toggles input:focus-visible {
    outline: 1px solid #f97316;
    outline-offset: 2px;
  }

  [hidden] { display: none !important; }

  .sync-status {
    font-size: 10px;
    color: #64748b;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    display: inline-block;
    flex-shrink: 0;
  }

  .btn-refresh {
    background: #1e293b;
    border: 1px solid #334155;
    color: #cbd5e1;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-refresh:hover { border-color: #f97316; color: #fff; }

  input[type="text"] {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f8fafc;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    width: 210px;
    outline: none;
  }
  input[type="text"]:focus { border-color: #f97316; }

  .mobile-tabs {
    display: none;
  }

  #backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 15, 0.72);
    backdrop-filter: blur(2px);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #backdrop.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .board {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding-top: 6px;
    min-height: 0;
  }

  .conf-box {
    position: relative;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 7px;
    padding: 8px 5px 5px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .conf-box.west {
    border-color: rgba(249, 115, 22, 0.28);
    background: rgba(249, 115, 22, 0.015);
  }

  .conf-box.east {
    border-color: rgba(56, 189, 248, 0.28);
    background: rgba(56, 189, 248, 0.015);
  }

  .conf-label {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    background: #070a12;
    padding: 0 8px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: 1;
  }

  .conf-box.west .conf-label { color: rgba(251, 146, 60, 0.85); }
  .conf-box.east .conf-label { color: rgba(56, 189, 248, 0.85); }

  .conf-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 5px;
    min-height: 0;
  }

  .card {
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 5px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    cursor: pointer;
    position: relative;
    transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease, opacity 0.15s ease;
  }

  .card:hover:not(.active) {
    border-color: #475569;
    background: #141d2f;
  }

  .card.dimmed {
    opacity: 0.18;
  }

  .card.active {
    opacity: 1 !important;
    z-index: 100;
    transform: scale(2);
    background: #0f172a;
    border-color: #f97316 !important;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(249, 115, 22, 0.7);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 2px 6px;
    background: #162033;
    border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
    height: 24px;
  }

  .card-header img {
    width: 20px;
    height: 20px;
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
  }

  .team-name {
    font-size: 11px;
    font-weight: 700;
    color: #f8fafc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-record {
    font-size: 9.5px;
    font-weight: 600;
    color: #64748b;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .game-tag {
    font-size: 8.5px;
    font-weight: 600;
    color: #94a3b8;
    background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(51, 65, 85, 0.6);
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
    letter-spacing: 0.1px;
  }

  .game-live {
    font-size: 8px;
    font-weight: 800;
    color: #34d399;
    background: rgba(6, 78, 59, 0.7);
    border: 1px solid rgba(16, 185, 129, 0.7);
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    letter-spacing: 0.15px;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.25);
  }

  .live-score {
    color: #ffffff;
    font-weight: 800;
  }

  .live-qtr {
    color: #a7f3d0;
    font-weight: 700;
  }

  .live-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 5px #10b981;
    animation: livePulse 1.4s infinite ease-in-out;
    flex-shrink: 0;
  }

  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.85); }
  }

  .col-labels {
    display: none;
    font-size: 7px;
    color: #64748b;
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .card.active .col-labels {
    display: inline;
  }

  .roster {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 1px 5px;
    min-height: 0;
  }

  .pos-row {
    display: grid;
    grid-template-columns: 15px repeat(3, minmax(0, 1fr));
    align-items: center;
    gap: 3px;
    border-bottom: 1px solid rgba(30, 41, 59, 0.45);
    padding: 1px 0;
  }
  .pos-row:last-child { border-bottom: none; }

  .card.active .pos-row {
    grid-template-columns: 14px repeat(5, minmax(0, 1fr));
    gap: 2px;
  }

  .slot-deep { display: none !important; }
  .card.active .slot-deep { display: flex !important; }

  .pos {
    font-size: 9px;
    font-weight: 800;
    color: #f97316;
  }

  .slot {
    display: flex;
    align-items: baseline;
    gap: 1.5px;
    overflow: hidden;
    white-space: nowrap;
    min-width: 0;
    padding: 0.5px 3px;
    border-radius: 3px;
    border: 1px solid transparent;
  }

  .slot-inj-O {
    border-color: rgba(239, 68, 68, 0.75);
    background: rgba(239, 68, 68, 0.12);
  }
  .slot-inj-D {
    border-color: rgba(249, 115, 22, 0.78);
    background: rgba(249, 115, 22, 0.14);
  }
  .slot-inj-Q, .slot-inj-DTD {
    border-color: rgba(234, 179, 8, 0.62);
    background: rgba(234, 179, 8, 0.09);
  }
  .slot-inj-P {
    border-color: rgba(253, 224, 71, 0.38);
    background: rgba(253, 224, 71, 0.04);
  }

  .s-num {
    font-size: 7px;
    font-weight: 700;
    color: #64748b;
    flex-shrink: 0;
  }

  .p-name {
    font-size: 11px;
    font-weight: 600;
    color: #f1f5f9;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .p-stats {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-end;
    align-self: center;
    font-size: 7.5px;
    font-weight: 600;
    color: #94a3b8;
    flex-shrink: 0;
    margin-left: auto;
    letter-spacing: -0.2px;
    line-height: 1.05;
  }

  .m-last { display: none; }
  .d-short { display: inline; }

  .card.active .p-name { font-size: 7.5px; }
  .card.active .p-stats { font-size: 5.8px; align-items: flex-start; }
  .card.active .s-num { font-size: 6px; }
  .card.active .slot { padding: 0.5px 2px; }
  .card.active .game-tag, .card.active .game-live { font-size: 6.8px; padding: 0.5px 4px; }
  .card.active .team-record { font-size: 8px; }

  .inj {
    font-size: 6px;
    font-weight: 800;
    margin-left: 0;
    padding-left: 1px;
    flex-shrink: 0;
    line-height: 1;
  }

  .inj-O { color: #fca5a5; }
  .inj-D { color: #fdba74; }
  .inj-DTD, .inj-Q { color: #fde047; }
  .inj-P { color: #fef08a; }

  .card.active .inj { font-size: 5px; }

  @media (min-width: 769px) {
    header { height: auto; min-height: 22px; flex-wrap: wrap; gap: 4px; }
    .controls { margin-left: auto; max-width: 100%; flex-wrap: wrap; justify-content: flex-end; }
    .stat-toggles { display: flex; align-items: center; gap: 7px; }
    body.hide-usg .p-usg, body.hide-mpg .p-mpg,
    body.hide-usg.hide-mpg .p-stats { display: none; }

    .card.active { transform: scale(2.1); }
    .card.active .card-header { height: 20px; }

    .card.active .roster { padding: 0 3px; }
    .card.active .pos-row { gap: 1px; padding: 0; }
    .card.active .slot {
      display: grid !important;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 0 1px;
      padding: 0 1px;
      line-height: 1.05;
    }
    .card.active .s-num { grid-column: 1; grid-row: 1; font-size: 5px; }
    .card.active .d-short { display: none; }
    .card.active .m-last { display: inline; }
    .card.active .p-name {
      grid-column: 2;
      grid-row: 1;
      font-size: 6px;
      white-space: normal;
      overflow-wrap: anywhere;
      text-overflow: clip;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .card.active .p-stats {
      grid-column: 2 / -1;
      grid-row: 2;
      margin-left: 0;
      font-size: 5px;
    }
    .card.active .inj {
      grid-column: 3;
      grid-row: 1;
      margin-left: 0;
      padding-left: 0;
      font-size: 5px;
    }
  }

  @media (min-width: 769px) and (max-height: 800px) {
    .card:not(.active) .pos-row { padding: 0; }
    .card:not(.active) .card-header { height: 22px; }
  }

  /* =========================================================
     MOBILE VIEW (Phones & Small Screens <= 768px)
     ========================================================= */
  @media (max-width: 768px) {
    body {
      padding: 3px 3px 3px;
      gap: 2px;
    }

    header {
      height: auto;
      flex-wrap: wrap;
      gap: 3px;
      padding: 0 1px;
    }

    .title-group {
      width: 100%;
      justify-content: space-between;
      gap: 4px;
    }

    h1 {
      font-size: 10.5px;
    }

    .legend {
      gap: 3px;
    }

    .legend-hint {
      display: none;
    }

    .legend-pill {
      font-size: 7px;
      padding: 0 3px;
    }

    .injury-summary { padding: 2px 7px; }
    .injury-summary strong { font-size: 11px; }
    .injury-dialog { width: calc(100vw - 16px); max-width: calc(100vw - 16px); height: calc(100dvh - 16px); max-height: calc(100dvh - 16px); }
    .injury-list { grid-template-columns: repeat(3, minmax(228px, 1fr)); overflow-x: auto; scroll-snap-type: x proximity; scroll-padding-inline: 8px; }
    .injury-column { scroll-snap-align: start; }
    .injury-dialog-header .injury-swipe-hint { display: block; color: #cbd5e1; }

    .controls {
      width: 100%;
      justify-content: space-between;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mobile-tabs {
      display: flex;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .m-tab {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      color: #64748b;
      background: transparent;
      border: none;
      cursor: pointer;
      letter-spacing: 0.3px;
    }

    .m-tab.active-west {
      background: rgba(249, 115, 22, 0.22);
      color: #fb923c;
    }

    .m-tab.active-east {
      background: rgba(56, 189, 248, 0.22);
      color: #38bdf8;
    }

    .sync-status {
      font-size: 7.5px;
      order: 1;
      flex-basis: 100%;
      justify-content: flex-end;
    }

    input[type="text"] {
      flex: 1;

</style>

<body>
  <header>
    <div class="title-group">
      <h1>🏀 NBA DEPTH CHARTS</h1>
      <div class="legend">
        <span class="legend-hint">Click any team to <strong>Enlarge (1st–5th String)</strong> •</span>
        <span class="legend-pill slot-inj-O"><span class="inj inj-O">O</span> Out</span>
        <span class="legend-pill slot-inj-D"><span class="inj inj-D">D</span> Doubt</span>
        <span class="legend-pill slot-inj-Q"><span class="inj inj-Q">Q/DTD</span> Quest</span>
        <span class="legend-pill slot-inj-P"><span class="inj inj-P">P</span> Prob</span>
      </div>
    </div>
    <div class="injury-summaries" role="group" aria-label="Injury summaries">
      <button type="button" class="injury-summary summary-out" id="injury-summary-out" aria-haspopup="dialog" aria-controls="injury-dialog" title="Out players across all five strings" disabled>
        <strong>—/—</strong><span>Out</span>
      </button>
      <button type="button" class="injury-summary summary-dtd" id="injury-summary-dtd" aria-haspopup="dialog" aria-controls="injury-dialog" title="DTD includes questionable, doubtful and probable players" disabled>
        <strong>—/—</strong><span>DTD</span>
      </button>
    </div>
    <div class="controls">
      <div class="mobile-tabs">
        <button class="m-tab active-west" id="tab-west" onclick="scrollToConf('WEST')">WEST ◀</button>
        <button class="m-tab" id="tab-east" onclick="scrollToConf('EAST')">▶ EAST</button>
      </div>
      <div class="stat-toggles" role="group" aria-label="Player statistics visibility">
        <label title="Show usage percentage for the selected period"><input type="checkbox" id="show-usg" checked>USG</label>
        <label title="Show minutes per game for the selected period"><input type="checkbox" id="show-mpg" checked>MPG</label>
      </div>
      <label class="stat-period-control">
        Stats
        <select id="stats-period" aria-label="Statistics look-back period">
          <option value="season">Season</option>
          <option value="14">Last 14 games</option>
          <option value="8" selected>Last 8 games</option>
        </select>
      </label>
      <span class="stats-status" id="stats-status" role="status" hidden></span>
      <div class="sync-status">
        <span class="pulse" id="pulse-dot"></span>
        <span id="last-updated">Connecting...</span>
      </div>
      <button class="btn-refresh" onclick="fetchLiveDepth(true)">↻ Sync</button>
      <input type="text" id="search" placeholder="Search team, player, 'LIVE', 'OUT'..." oninput="filterCards()">
    </div>
  </header>

  <div id="backdrop" onclick="closeActiveCard()"></div>

  <dialog class="injury-dialog" id="injury-dialog" aria-labelledby="injury-dialog-title" aria-describedby="injury-dialog-description">
    <div class="injury-dialog-header">
      <div>
        <h2 id="injury-dialog-title">Out players</h2>
        <p id="injury-dialog-description"></p>
        <p class="injury-swipe-hint">Swipe across for all three lists.</p>
      </div>
      <button type="button" class="injury-close" aria-label="Close player list" autofocus>×</button>
    </div>
    <div class="injury-list" id="injury-list"></div>
  </dialog>

  <div class="board" id="board">
    <div class="conf-box west" id="box-west">
      <span class="conf-label">Western Conference</span>
      <div class="conf-grid" id="grid-west"></div>
    </div>
    <div class="conf-box east" id="box-east">
      <span class="conf-label">Eastern Conference</span>
      <div class="conf-grid" id="grid-east"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://ancient-haze-faf8.thomrisped.workers.dev";
    const STAT_PERIOD_LABELS = { season: 'Season', '14': 'Last 14 games', '8': 'Last 8 games' };
    const INJURY_STRINGS = [
      { key: 'first', label: '1st string' },
      { key: 'second', label: '2nd string' },
      { key: 'rest', label: 'Rest', detail: '3rd–5th' }
    ];
    const STATS_CACHE_TTL = 30 * 60 * 1000;
    const PLAYER_JUMP_HIGHLIGHT_MS = 1600;

    let LEAGUE_DATA = [];
    let statPeriod = '8';
    const PLAYER_STATS_BY_PERIOD = {};
    let activeCardId = null;
    let activeConf = null;
    let injuryPlayers = [];
    let activeInjuryGroup = null;
    let playerJumpTarget = null;
    let playerJumpTimer = null;

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function getPlayerKey(player) {
      const name = [player.fullName, player.shortName].find(value => value && value.trim() && value.trim() !== '-');
      if (!name) return '';
      const id = String(player.id || '').trim();
      return id ? `id:${id}` : `name:${name.trim().replace(/\s+/g, ' ').toLowerCase()}`;
    }

    function getInjuryStatus(player) {
      const codes = [player.injury, player.injuryCode].map(value => String(value || '').trim().toUpperCase());
      if (codes.some(code => ['O', 'OUT'].includes(code))) return { group: 'out', label: 'O', name: 'Out' };
      const statuses = {
        Q: ['Q', 'Questionable'], QUESTIONABLE: ['Q', 'Questionable'],
        D: ['D', 'Doubtful'], DOUBTFUL: ['D', 'Doubtful'],
        P: ['P', 'Probable'], PROBABLE: ['P', 'Probable'],
        DTD: ['DTD', 'Day-to-day'], 'DAY-TO-DAY': ['DTD', 'Day-to-day']
      };
      for (const code of codes) {
        if (Object.hasOwn(statuses, code)) {
          const [label, name] = statuses[code];
          return { group: 'dtd', label, name };
        }
      }
      return { group: '', label: '', name: '' };
    }

    function updateInjurySummaries() {
      const uniquePlayers = new Map();
      for (const team of LEAGUE_DATA) {
        for (const position of ['PG', 'SG', 'SF', 'PF', 'C']) {
          (team.depth[position] || []).slice(0, 5).forEach((player, depthIndex) => {
            const key = getPlayerKey(player);
            if (!key) return;
            const status = getInjuryStatus(player);
            const previous = uniquePlayers.get(key);
            const priority = group => group === 'out' ? 2 : group === 'dtd' ? 1 : 0;
            // Count each player once and use their highest string across positions.
            if (!previous) {
              uniquePlayers.set(key, { key, player, team, position, status, depthIndex });
            } else {
              if (depthIndex < previous.depthIndex) {
                previous.depthIndex = depthIndex;
                previous.team = team;
                previous.position = position;
              }
              if (priority(status.group) > priority(previous.status.group)) {
                previous.player = player;
                previous.status = status;
              }
            }
          });
        }
      }
      injuryPlayers = [...uniquePlayers.values()];
      for (const group of ['out', 'dtd']) {
        const count = injuryPlayers.filter(entry => entry.status.group === group).length;
        const button = document.getElementById(`injury-summary-${group}`);
        button.querySelector('strong').textContent = `${count}/${injuryPlayers.length}`;
        button.dataset.count = count;
        button.dataset.total = injuryPlayers.length;
        button.setAttribute('aria-label', `${count} of ${injuryPlayers.length} players ${group === 'out' ? 'Out' : 'DTD, questionable, doubtful or probable'}`);
        button.disabled = LEAGUE_DATA.length === 0;
      }
      if (document.getElementById('injury-dialog').open) renderInjuryList();
    }

    function injuryStatValue(metric, playerId) {
      const value = PLAYER_STATS_CACHE[playerId]?.[metric];
      return Number.isFinite(value) ? (metric === 'usg' ? `${value}%` : value.toFixed(1)) : '—';
    }

    function injuryImpactScore(entry) {
      const stats = PLAYER_STATS_CACHE[entry.player.id];
      return Number.isFinite(stats?.mpg) && Number.isFinite(stats?.usg) ? stats.mpg ** 2 * stats.usg : -1;
    }

    function injuryStringKey(entry) {
      return entry.depthIndex === 0 ? 'first' : entry.depthIndex === 1 ? 'second' : 'rest';
    }

    function sortedInjuryPlayers() {
      return injuryPlayers.filter(entry => entry.status.group === activeInjuryGroup)
        .sort((a, b) => injuryImpactScore(b) - injuryImpactScore(a)
          || (a.player.fullName || a.player.shortName).localeCompare(b.player.fullName || b.player.shortName)
          || a.key.localeCompare(b.key));
    }

    function updateInjuryListStats() {
      if (!document.getElementById('injury-dialog').open) return;
      const list = document.getElementById('injury-list');
      const rows = [...list.querySelectorAll('.injury-player-button')];
      rows.forEach(row => {
        row.querySelectorAll('.injury-stat-value').forEach(value => {
          value.textContent = injuryStatValue(value.dataset.metric, row.dataset.playerId);
        });
      });
      // Rank each string independently while preserving its scroll and focused player.
      const rowsByKey = new Map(rows.map(row => [row.dataset.playerKey, row]));
      const players = sortedInjuryPlayers();
      const focusedRow = list.contains(document.activeElement) ? document.activeElement.closest('.injury-player-button') : null;
      const columns = [...list.querySelectorAll('.injury-column-players')];
      const scrollTops = columns.map(column => column.scrollTop);
      let orderChanged = false;
      columns.forEach(column => {
        const currentRows = [...column.querySelectorAll('.injury-player-button')];
        const orderedRows = players.filter(entry => injuryStringKey(entry) === column.dataset.string)
          .map(entry => rowsByKey.get(entry.key)).filter(Boolean);
        if (orderedRows.some((row, index) => row !== currentRows[index])) {
          column.append(...orderedRows);
          orderChanged = true;
        }
      });
      if (orderChanged) {
        focusedRow?.focus({ preventScroll: true });
        columns.forEach((column, index) => { column.scrollTop = scrollTops[index]; });
      }
    }

    function buildInjuryPlayerHTML(entry) {
      return `
        <button type="button" class="injury-player-button" data-player-key="${escapeHTML(entry.key)}" data-player-id="${escapeHTML(entry.player.id || '')}" data-team-abbr="${escapeHTML(entry.team.abbr)}" title="${escapeHTML([entry.player.fullName || entry.player.shortName, entry.team.team, entry.player.injuryDetail || entry.status.name].join(' · '))}">
          <span class="injury-player-info">
            <span class="injury-player-name">${escapeHTML(entry.player.fullName || entry.player.shortName)}</span>
            <span class="injury-player-team">
              ${entry.team.logo ? `<img class="injury-team-logo" src="${escapeHTML(entry.team.logo)}" alt="" width="16" height="16" decoding="async" onerror="this.hidden=true">` : ''}
              <span class="injury-player-team-text">${escapeHTML(entry.team.abbr)} · ${escapeHTML(entry.position)}</span>
            </span>
          </span>
          <span class="injury-player-stats">
            <span class="injury-stat"><span class="injury-stat-label">USG</span><span class="injury-stat-value" data-metric="usg">${injuryStatValue('usg', entry.player.id)}</span></span>
            <span class="injury-stat"><span class="injury-stat-label">MPG</span><span class="injury-stat-value" data-metric="mpg">${injuryStatValue('mpg', entry.player.id)}</span></span>
          </span>
          <span class="injury-status injury-status-${entry.status.group}" title="${entry.status.name}">${entry.status.label}</span>
        </button>
      `;
    }

    function renderInjuryList(resetScroll = false) {
      if (!activeInjuryGroup) return;
      const list = document.getElementById('injury-list');
      const focusedRow = list.contains(document.activeElement) ? document.activeElement.closest('.injury-player-button') : null;
      const focusedKey = focusedRow?.dataset.playerKey;
      const focusedString = document.activeElement.classList.contains('injury-column-players') ? document.activeElement.dataset.string : null;
      const scrollLeft = resetScroll ? 0 : list.scrollLeft;
      const scrollTops = new Map([...list.querySelectorAll('.injury-column-players')]
        .map(column => [column.dataset.string, resetScroll ? 0 : column.scrollTop]));
      const players = sortedInjuryPlayers();
      document.getElementById('injury-dialog-title').textContent = activeInjuryGroup === 'out' ? 'Out players' : 'DTD players';
      document.getElementById('injury-dialog-description').textContent =
        `${players.length} of ${injuryPlayers.length} players · ${STAT_PERIOD_LABELS[statPeriod]} · Each string ranked by MPG² × USG, highest first. `
        + (activeInjuryGroup === 'dtd' ? 'Q / D / P / DTD. ' : '')
        + 'Select a player to open their team.';
      list.innerHTML = INJURY_STRINGS.map(({ key, label, detail }) => {
        const columnPlayers = players.filter(entry => injuryStringKey(entry) === key);
        return `
          <section class="injury-column" data-string="${key}" aria-labelledby="injury-heading-${key}">
            <div class="injury-column-header">
              <h3 id="injury-heading-${key}">${label}</h3>
              ${detail ? `<span class="injury-column-detail">${detail}</span>` : ''}
              <span class="injury-column-count">${columnPlayers.length}</span>
            </div>
            <div class="injury-column-players" data-string="${key}" tabindex="0" role="region" aria-label="${label} players">
              ${columnPlayers.length ? columnPlayers.map(buildInjuryPlayerHTML).join('') : '<p class="injury-empty">No players in this string.</p>'}
            </div>
          </section>
        `;
      }).join('');
      if (focusedKey) {
        const next = [...list.querySelectorAll('.injury-player-button')].find(row => row.dataset.playerKey === focusedKey);
        (next || document.querySelector('.injury-close')).focus({ preventScroll: true });
      } else if (focusedString) {
        list.querySelector(`.injury-column-players[data-string="${focusedString}"]`)?.focus({ preventScroll: true });
      }
      list.querySelectorAll('.injury-column-players').forEach(column => {
        column.scrollTop = scrollTops.get(column.dataset.string) || 0;
      });
      list.scrollLeft = scrollLeft;
    }

    function openInjuryDialog(group) {
      if (!['out', 'dtd'].includes(group)) return;
      closeActiveCard();
      activeInjuryGroup = group;
      renderInjuryList(true);
      document.getElementById('injury-dialog').showModal();
      document.getElementById('injury-list').scrollLeft = 0;
    }

    function closeInjuryDialog() {
      document.getElementById('injury-dialog').close();
      activeInjuryGroup = null;
    }

    function clearPlayerJumpHighlight() {
      clearTimeout(playerJumpTimer);
      playerJumpTarget = null;
      document.querySelectorAll('.player-jump-highlight').forEach(name => {
        name.classList.remove('player-jump-highlight');
        name.style.removeProperty('animation-delay');
      });
    }

    function openInjuryPlayer(key, teamAbbr) {
      const entry = injuryPlayers.find(player => player.key === key && player.team.abbr === teamAbbr);
      if (!entry) return;
      closeInjuryDialog();
      if (window.matchMedia('(max-width: 768px)').matches) {
        const board = document.getElementById('board');
        const box = document.getElementById(`box-${entry.team.conf.toLowerCase()}`);
        board.scrollLeft += box.getBoundingClientRect().left - board.getBoundingClientRect().left;
      }
      const cardId = `card-${entry.team.abbr}`;
      if (!openCard(cardId, entry.team.conf)) return;
      clearPlayerJumpHighlight();
      const startedAt = Date.now();
      playerJumpTarget = { key, teamAbbr, startedAt, expiresAt: startedAt + PLAYER_JUMP_HIGHLIGHT_MS };
      const card = document.getElementById(cardId);
      void card.offsetWidth;
      card.querySelectorAll('.p-name[data-player-key]').forEach(name => {
        if (name.dataset.playerKey === key) name.classList.add('player-jump-highlight');
      });
      card.focus({ preventScroll: true });
      playerJumpTimer = setTimeout(clearPlayerJumpHighlight, PLAYER_JUMP_HIGHLIGHT_MS);
    }

    for (const group of ['out', 'dtd']) {
      document.getElementById(`injury-summary-${group}`).addEventListener('click', () => openInjuryDialog(group));
    }
    const injuryDialog = document.getElementById('injury-dialog');
    injuryDialog.querySelector('.injury-close').addEventListener('click', closeInjuryDialog);
    injuryDialog.addEventListener('close', () => { if (!injuryDialog.open) activeInjuryGroup = null; });
    injuryDialog.addEventListener('click', event => {
      if (event.target !== injuryDialog) return;
      const rect = injuryDialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) closeInjuryDialog();
    });
    document.getElementById('injury-list').addEventListener('click', event => {
      const row = event.target.closest('.injury-player-button');
      if (row) openInjuryPlayer(row.dataset.playerKey, row.dataset.teamAbbr);
    });

    // A cache entry belongs to one period and expires independently of the others.
    try {
      const savedPeriod = localStorage.getItem('nba_stat_period_v1');
      if (Object.hasOwn(STAT_PERIOD_LABELS, savedPeriod)) statPeriod = savedPeriod;
      const saved = JSON.parse(localStorage.getItem('nba_player_stats_cache_v2') || '{}');
      for (const period of Object.keys(STAT_PERIOD_LABELS)) {
        const entry = saved[period];
        if (entry?.ts && Date.now() - entry.ts < STATS_CACHE_TTL && entry.data) {
          PLAYER_STATS_BY_PERIOD[period] = entry;
        }
      }
    } catch (e) {}

    function getPlayerStatsCache(period = statPeriod) {
      const entry = PLAYER_STATS_BY_PERIOD[period];
      if (!entry || Date.now() - entry.ts >= STATS_CACHE_TTL) {
        PLAYER_STATS_BY_PERIOD[period] = { ts: Date.now(), data: {} };
      }
      return PLAYER_STATS_BY_PERIOD[period].data;
    }

    let PLAYER_STATS_CACHE = getPlayerStatsCache();
    const periodSelect = document.getElementById('stats-period');
    periodSelect.value = statPeriod;
    periodSelect.addEventListener('change', () => {
      statPeriod = periodSelect.value;
      try { localStorage.setItem('nba_stat_period_v1', statPeriod); } catch (e) {}
      renderBoard();
    });

    function statsPeriodDescription() {
      return statPeriod === 'season' ? 'the current regular season'
        : `the last ${statPeriod} regular-season appearances (or all available if fewer)`;
    }

    function setStatsStatus(message, period) {
      if (period !== statPeriod) return;
      const status = document.getElementById('stats-status');
      status.textContent = message;
      status.hidden = !message;
    }

    // Desktop preferences do not hide statistics in the enlarged mobile view.
    const statVisibility = { usg: true, mpg: true };
    try {
      const saved = JSON.parse(localStorage.getItem('nba_stat_visibility_v1') || '{}');
      for (const metric of ['usg', 'mpg']) {
        if (typeof saved[metric] === 'boolean') statVisibility[metric] = saved[metric];
      }
    } catch (e) {}
    for (const metric of ['usg', 'mpg']) {
      const checkbox = document.getElementById(`show-${metric}`);
      checkbox.checked = statVisibility[metric];
      document.body.classList.toggle(`hide-${metric}`, !checkbox.checked);
      checkbox.addEventListener('change', () => {
        statVisibility[metric] = checkbox.checked;
        document.body.classList.toggle(`hide-${metric}`, !checkbox.checked);
        try {
          localStorage.setItem('nba_stat_visibility_v1', JSON.stringify(statVisibility));
        } catch (e) {}
      });
    }

    function savePlayerStatsCache() {
      try {
        localStorage.setItem('nba_player_stats_cache_v2', JSON.stringify(PLAYER_STATS_BY_PERIOD));
      } catch (e) {}
    }

    function formatPlayerStat(metric, value) {
      return metric === 'usg' ? `usg: ${value}%` : `mpg: ${value.toFixed(1)}`;
    }

    // Fetch both statistics in batches of 20, using one upstream gamelog per player.
    let statsWorkerRunning = false;
    let statsFetchController = null;
    async function hydrateAllPlayerStats() {
      // Switching periods cancels old batches before they can update the current view.
      statsFetchController?.abort();
      const controller = new AbortController();
      statsFetchController = controller;
      const period = statPeriod;
      const periodCache = getPlayerStatsCache(period);
      statsWorkerRunning = true;

      try {
        const queue = [];
        for (const t of LEAGUE_DATA) {
          for (const pos of ['PG', 'SG', 'SF', 'PF', 'C']) {
            const players = t.depth[pos] || [];
            players.forEach((p, idx) => {
              const cached = periodCache[p.id];
              if (p.id && (!Number.isFinite(cached?.usg) || !Number.isFinite(cached?.mpg))) {
                queue.push({ id: p.id, priority: idx });
              }
            });
          }
        }

        queue.sort((a, b) => a.priority - b.priority);
        const uniqueIds = [...new Set(queue.map(q => q.id))];
        setStatsStatus(uniqueIds.length ? 'Loading stats…' : '', period);
        let hadFailure = false;

        const BATCH_SIZE = 20;
        for (let i = 0; i < uniqueIds.length; i += BATCH_SIZE) {
          if (controller.signal.aborted) return;
          const batch = uniqueIds.slice(i, i + BATCH_SIZE);
          try {
            const res = await fetch(`${WORKER_URL}?usg=${batch.join(',')}&period=${period}&v=6`, {
              signal: controller.signal
            });
            if (res.ok) {
              const data = await res.json();
              if (controller.signal.aborted) return;
              // Older Workers only support 8 games. Never label their results as another period.
              if (data.period !== period && !(period === '8' && data.period === undefined)) {
                setStatsStatus('Selected period unavailable', period);
                return;
              }
              for (const pid of batch) {
                for (const metric of ['usg', 'mpg']) {
                  const value = data[metric]?.[pid];
                  // Missing or failed lookups stay retryable on the next sync.
                  if (!Number.isFinite(value)) continue;
                  periodCache[pid] = { ...periodCache[pid], [metric]: value };
                  if (period !== statPeriod) continue;
                  document.querySelectorAll(`.${metric}-slot-${pid}`).forEach(el => {
                    el.textContent = formatPlayerStat(metric, value);
                    el.hidden = false;
                    el.parentElement.hidden = false;
                  });
                }
              }
              savePlayerStatsCache();
              if (period === statPeriod) updateInjuryListStats();
            } else { hadFailure = true; }
          } catch (e) {
            if (controller.signal.aborted) return;
            hadFailure = true;
          }
        }

        setStatsStatus(hadFailure ? 'Some stats unavailable' : '', period);
      } finally {
        if (statsFetchController === controller) {
          statsWorkerRunning = false;
          statsFetchController = null;
        }
      }
    }

    function isUSUser() {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      return tz.startsWith("America/") && (navigator.language || "").toUpperCase().endsWith("US");
    }

    function getLastName(shortName) {
      if (!shortName || shortName === '-') return '-';
      const idx = shortName.indexOf('. ');
      return idx !== -1 ? shortName.slice(idx + 2) : shortName;
    }

    function formatQuarter(clockStr) {
      if (!clockStr) return '';
      const s = clockStr.toUpperCase();
      if (s.includes('HALF')) return 'Half';
      if (s.includes('END OF')) return clockStr.replace(/End of /i, 'End ').replace('1st', 'Q1').replace('2nd', 'Q2').replace('3rd', 'Q3').replace('4th', 'Q4');
      
      const parts = clockStr.split(' - ');
      if (parts.length === 2) {
        const time = parts[0].trim();
        const per = parts[1].trim().toUpperCase();
        let q = per;
        if (per === '1ST') q = 'Q1';
        else if (per === '2ND') q = 'Q2';
        else if (per === '3RD') q = 'Q3';
        else if (per === '4TH') q = 'Q4';
        return `${q} ${time}`;
      }
      return clockStr;
    }

    function formatGameBadge(game) {
      if (!game) return '';

      if (game.isLive) {
        const opp = game.opp ? `<span class="g-opp">${game.opp}</span>` : '';
        const score = game.score ? `<span class="live-score">${game.score}</span>` : '';
        const qtr = formatQuarter(game.clock);
        const qtrSpan = qtr ? `<span class="live-qtr">(${qtr})</span>` : '';

        const tipParts = ['LIVE GAME'];
        if (game.opp) tipParts.push(game.opp);
        if (game.score) tipParts.push(game.score);
        if (game.clock) tipParts.push(game.clock);

        return `<span class="game-live" title="${tipParts.join(' • ')}"><span class="live-dot"></span><span class="g-live-word">LIVE</span>${opp}${score}${qtrSpan}</span>`;
      }

      if (!game.date) return '';
      const dt = new Date(game.date);
      if (isNaN(dt.getTime())) return '';

      const now = new Date();
      const isToday = dt.toDateString() === now.toDateString();
      const tomorrow = new Date(now);
      tomorrow.setDate(now.getDate() + 1);
      const isTomorrow = dt.toDateString() === tomorrow.toDateString();

      const use12h = isUSUser();
      const timeStr = dt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: use12h });

      let dateLabel = '';
      if (isToday) {
        dateLabel = `Today ${timeStr}`;
      } else if (isTomorrow) {
        dateLabel = `Tmrw ${timeStr}`;
      } else {
        const dayStr = dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        dateLabel = `${dayStr}, ${timeStr}`;
      }

      const oppSpan = game.opp ? ` <span class="g-opp">${game.opp}</span>` : '';
      const fullTooltip = `Next Game: ${dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })} at ${timeStr} ${game.opp || ''}`;
      return `<span class="game-tag" title="${fullTooltip}">${dateLabel}${oppSpan}</span>`;
    }

    function scrollToConf(conf) {
      const board = document.getElementById('board');
      const left = conf === 'EAST' ? board.clientWidth : 0;
      board.scrollTo({ left, behavior: 'smooth' });
    }

    document.getElementById('board').addEventListener('scroll', (e) => {
      const board = e.target;
      const isEast = board.scrollLeft > board.clientWidth * 0.45;
      const tabWest = document.getElementById('tab-west');
      const tabEast = document.getElementById('tab-east');
      if (isEast) {
        tabWest.className = 'm-tab';
        tabEast.className = 'm-tab active-east';
      } else {
        tabWest.className = 'm-tab active-west';
        tabEast.className = 'm-tab';
      }
    });

    function getTransformOrigin(conf, localIdx) {
      const localCol = localIdx % 3;
      const globalCol = conf === 'WEST' ? localCol : localCol + 3;
      const row = Math.floor(localIdx / 3);
      
      let x = 'center';
      if (globalCol === 0) x = 'left';
      else if (globalCol === 5) x = 'right';

      let y = 'center';
      if (row === 0) y = 'top';
      else if (row === 4) y = 'bottom';

      return `${x} ${y}`;
    }

    function toggleCard(cardId, conf, event) {
      event.stopPropagation();
      if (activeCardId === cardId) {
        closeActiveCard();
        return;
      }
      openCard(cardId, conf);
    }

    function openCard(cardId, conf) {
      const card = document.getElementById(cardId);
      if (!card) return false;
      if (activeCardId !== null) {
        const prev = document.getElementById(activeCardId);
        if (prev) prev.classList.remove('active');
      }

      activeCardId = cardId;
      activeConf = conf;
      card.classList.add('active');
      
      document.getElementById('box-west').style.zIndex = conf === 'WEST' ? '60' : '1';
      document.getElementById('box-east').style.zIndex = conf === 'EAST' ? '60' : '1';
      
      document.getElementById('backdrop').classList.add('visible');
      return true;
    }

    function closeActiveCard() {
      clearPlayerJumpHighlight();
      if (activeCardId !== null) {
        const card = document.getElementById(activeCardId);
        if (card) card.classList.remove('active');
        activeCardId = null;
        activeConf = null;
      }
      document.getElementById('box-west').style.zIndex = '';
      document.getElementById('box-east').style.zIndex = '';
      document.getElementById('backdrop').classList.remove('visible');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !injuryDialog.open) closeActiveCard();
    });

    function buildCardHTML(t, localIdx) {
      const cardId = `card-${t.abbr}`;
      const origin = getTransformOrigin(t.conf, localIdx);
      const isActive = activeCardId === cardId ? 'active' : '';
      const gameBadgeHTML = formatGameBadge(t.game);
      return `
        <div class="card ${isActive}" id="${cardId}" tabindex="-1"
             onclick="toggleCard('${cardId}', '${t.conf}', event)"
             style="border-top: 2px solid ${t.color}; transform-origin: ${origin};">
          <div class="card-header">
            <img src="${t.logo}" alt="${t.abbr}">
            <span class="team-name">${t.team}</span>
            ${t.record ? `<span class="team-record">${t.record}</span>` : ''}
            <div class="header-right">
              ${gameBadgeHTML}
              <span class="col-labels">1ST–5TH</span>
            </div>
          </div>
          <div class="roster">
            ${['PG', 'SG', 'SF', 'PF', 'C'].map(pos => {
              const players = t.depth[pos] || [];
              return `
                <div class="pos-row">
                  <span class="pos">${pos}</span>
                  ${[0, 1, 2, 3, 4].map(slotIdx => {
                    const p = players[slotIdx] || {id: '', shortName: '-', fullName: '-', injury: '', injuryDetail: ''};
                    const deepClass = slotIdx >= 3 ? 'slot-deep' : '';
                    const hasPlayer = p.shortName && p.shortName !== '-';
                    const playerKey = getPlayerKey(p);
                    const jumpClass = playerJumpTarget?.key === playerKey && playerJumpTarget.teamAbbr === t.abbr
                      && playerJumpTarget.expiresAt > Date.now() ? 'player-jump-highlight' : '';
                    const jumpDelay = jumpClass ? `style="animation-delay: -${Math.max(0, Date.now() - playerJumpTarget.startedAt)}ms"` : '';
                    const lastName = getLastName(p.shortName);
                    const cachedStats = PLAYER_STATS_CACHE[p.id] || {};
                    const hasUsg = Number.isFinite(cachedStats.usg);
                    const hasMpg = Number.isFinite(cachedStats.mpg);

                    const tooltipParts = [`${pos}${slotIdx+1}: ${p.fullName}`];
                    if (hasUsg) tooltipParts.push(`${STAT_PERIOD_LABELS[statPeriod]} USG: ${cachedStats.usg}%`);
                    if (hasMpg) tooltipParts.push(`${STAT_PERIOD_LABELS[statPeriod]} MPG: ${cachedStats.mpg.toFixed(1)}`);
                    if (p.injuryDetail) tooltipParts.push(p.injuryDetail);

                    const slotInjClass = p.injury ? `slot-inj-${p.injury}` : '';
                    const injTextClass = p.injury ? `inj-${p.injury}` : '';
                    return `
                      <div class="slot ${deepClass} ${slotInjClass}" title="${tooltipParts.join(' — ')}">
                        ${hasPlayer ? `<span class="s-num">${slotIdx + 1}</span>` : ''}
                        <span class="p-name ${jumpClass}" data-player-key="${escapeHTML(playerKey)}" ${jumpDelay}>
                          <span class="d-short">${p.shortName}</span>
                          <span class="m-last">${lastName}</span>
                        </span>
                        <span class="p-stats" ${hasUsg || hasMpg ? '' : 'hidden'}>
                          <span class="p-usg usg-slot-${p.id}" title="USG% over ${statsPeriodDescription()}" ${hasUsg ? '' : 'hidden'}>${hasUsg ? formatPlayerStat('usg', cachedStats.usg) : ''}</span>
                          <span class="p-mpg mpg-slot-${p.id}" title="Minutes per game over ${statsPeriodDescription()}" ${hasMpg ? '' : 'hidden'}>${hasMpg ? formatPlayerStat('mpg', cachedStats.mpg) : ''}</span>
                        </span>
                        ${p.injury ? `<span class="inj ${injTextClass}">${p.injury}</span>` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderBoard() {
      PLAYER_STATS_CACHE = getPlayerStatsCache();
      const westTeams = LEAGUE_DATA.filter(t => t.conf === 'WEST');
      const eastTeams = LEAGUE_DATA.filter(t => t.conf === 'EAST');

      document.getElementById('grid-west').innerHTML = westTeams.map((t, i) => buildCardHTML(t, i)).join('');
      document.getElementById('grid-east').innerHTML = eastTeams.map((t, i) => buildCardHTML(t, i)).join('');
      updateInjurySummaries();
      filterCards();
      hydrateAllPlayerStats();
    }

    function filterCards() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      LEAGUE_DATA.forEach(t => {
        const card = document.getElementById(`card-${t.abbr}`);
        if (!card) return;
        if (!q) {
          card.classList.remove('dimmed');
          return;
        }
        const matchTeam = t.team.toLowerCase().includes(q) || t.abbr.toLowerCase().includes(q);
        const matchLive = q === 'live' && t.game && t.game.isLive;
        const matchPlayer = Object.values(t.depth).some(posList =>
          posList.some(p => 
            p.fullName.toLowerCase().includes(q) || 
            p.shortName.toLowerCase().includes(q) ||
            (p.injury && p.injury.toLowerCase() === q) ||
            (p.injuryCode && p.injuryCode.toLowerCase() === q)
          )
        );
        if (matchTeam || matchLive || matchPlayer) {
          card.classList.remove('dimmed');
        } else {
          card.classList.add('dimmed');
        }
      });
    }

    async function fetchLiveDepth() {
      const statusEl = document.getElementById('last-updated');
      const pulseEl = document.getElementById('pulse-dot');
      try {
        statusEl.textContent = 'Syncing...';
        const res = await fetch(WORKER_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        LEAGUE_DATA = data.teams || [];
        renderBoard();

        const dt = new Date(data.updatedAt || Date.now());
        const isUS = isUSUser();

        const dateStr = dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        const timeStr = dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: isUS });
        statusEl.textContent = `Updates every 2 mins - last updated ${dateStr}, ${timeStr}`;
        pulseEl.style.background = '#10b981';
      } catch (err) {
        statusEl.textContent = 'Sync error (check Worker URL)';
        pulseEl.style.background = '#ef4444';
      }
    }

    fetchLiveDepth();
    setInterval(fetchLiveDepth, 120000);
  </script>
</body>
